# GENERATED by script/fixtures/symbologies.rb - do not edit. Regenerate with
#   mise exec -- bundle exec script/generate_fixtures symbologies
# Schema: test/fixtures/README.md. Encoders (independent of zxing-cpp): zint 2.16.0, rqrcode_core 2.1.0.
#
# Expectations: what zxing-cpp 3.1.1 reports for ZXingFFI.read(image, **read_options) with the gem defaults
# (text_mode: :plain, formats: :all, validate_optional_checksum: true, library-default try_* options): exactly one
# barcode per file. Checked through the C API against the vendored and the Homebrew libZXing 3.1.1 builds, also
# with try_harder: false. bytes_hex is given where the bytes are not plain ASCII text (UTF-8, binary, GS1);
# otherwise bytes == text.
#
# `format` is what zxing-cpp actually reports, which is not always the encoded variant: UPC-A and ISBN -> ean_13
# (13-digit text), ITF-14 -> itf, standard Code 39 -> code_39, Compact PDF417 -> pdf417, Aztec Code/Rune -> aztec,
# DataBar Stacked Omni -> databar_stacked, QR Model 2 -> qr_code.
#
# Readable formats without a fixture:
#   qr_code_model_1  zint cannot encode QR Code Model 1
#   other_barcode    generic ISO/IEC 15424 "X" symbology, no encoder (dx_film_edge is its only concrete variant)
#   code_39_standard, itf_14, isbn, upc_a, aztec_code, aztec_rune, compact_pdf417, databar_stacked_omni,
#   qr_code_model_2  never reported by the 3.1.1 readers (see above; upc_a only with formats excluding ean_13),
#                    their encodings are covered by the fixtures below
#   ean_5, ean_2     not readable on their own (no 'r' flag); covered as add-ons by ean_13_add_on_{2,5}

